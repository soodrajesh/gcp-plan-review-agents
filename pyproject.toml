[project]
name = "planreview"
version = "0.1.0"
description = "Multi-agent Terraform plan review: specialist agents, a critic and a deterministic judge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "google-genai>=1.0",
  "google-cloud-firestore>=2.19",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "httpx", "ruff"]
# Test/eval-only second provider; never installed in the deployed image.
openai = ["openai>=1.50"]

[project.scripts]
planreview = "planreview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["planreview"]

[tool.setuptools.package-data]
planreview = ["*.html", "samples/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
testpaths = ["tests"]
markers = [
  "live_vertex: calls Gemini on Vertex AI; opt-in via PLANREVIEW_LIVE_VERTEX=1",
  "live_openai: calls the real OpenAI API; opt-in via PLANREVIEW_LIVE_OPENAI=1",
  "firestore: needs real Firestore; opt-in via PLANREVIEW_FIRESTORE_PROJECT=<project>",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
